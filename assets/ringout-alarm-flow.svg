<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="346" viewBox="0 0 1056 346">
  <title>알람에서 도착까지</title>
  <desc>시간과 목적지를 정하고, 알람을 끄면 이동 미션이 시작됩니다. 이동 중에는 설정한 간격마다 다시 울리며, 목적지에 도착하면 미션을 마쳐요.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#b4451c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1056" height="346" rx="24" fill="#fff8f3"/>
  <g fill="none" stroke="#b4451c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M231 135L296 116"/>
    <path d="M495 116L560 135"/>
    <path d="M759 135L824 116"/>
  </g>
  <g stroke="#f4d8ca" stroke-width="2">
    <circle cx="132" cy="144" r="94" fill="#fffdfb"/>
    <circle cx="396" cy="106" r="94" fill="#ffefe5"/>
    <circle cx="660" cy="144" r="94" fill="#ffe0cf"/>
    <circle cx="924" cy="106" r="94" fill="#fffdfb"/>
  </g>
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#354153">
    <g transform="translate(132 144)">
      <text y="-24" font-size="46" font-weight="800" fill="#b4451c">1</text>
      <text y="10" font-size="20" font-weight="800">시간·목적지 설정</text>
      <text y="38" font-size="16">언제, 어디로 갈지<tspan x="0" dy="22">미리 정해요.</tspan></text>
    </g>
    <g transform="translate(396 106)">
      <text y="-24" font-size="46" font-weight="800" fill="#b4451c">2</text>
      <text y="10" font-size="20" font-weight="800">알람 울림</text>
      <text y="38" font-size="16">알람을 끄고 이동<tspan x="0" dy="22">미션을 시작해요.</tspan></text>
    </g>
    <g transform="translate(660 144)">
      <text y="-24" font-size="46" font-weight="800" fill="#b4451c">3</text>
      <text y="10" font-size="20" font-weight="800">목적지로 이동</text>
      <text y="38" font-size="16">계획했던 장소로<tspan x="0" dy="22">움직여요.</tspan></text>
    </g>
    <g transform="translate(924 106)">
      <text y="-24" font-size="46" font-weight="800" fill="#b4451c">4</text>
      <text y="10" font-size="20" font-weight="800">도착·알람 종료</text>
      <text y="38" font-size="16">목적지에 도착하면<tspan x="0" dy="22">미션을 마쳐요.</tspan></text>
    </g>
    <path d="M609 224C571 306 746 306 711 224" fill="none" stroke="#b4451c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
    <rect x="468" y="292" width="384" height="37" rx="18.5" fill="#ffe9dc"/>
    <text x="660" y="317" font-size="18" font-weight="700" fill="#9d3917">도착 전에는 설정한 간격마다 다시 울려요</text>
  </g>
</svg>
